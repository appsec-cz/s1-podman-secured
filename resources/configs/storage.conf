[storage]
# The machine's root filesystem is btrfs, so image layers become subvolumes and
# containers get copy-on-write straight from the filesystem - no overlay, no FUSE.
#
# Priority rather than a fixed driver: pinning driver = "btrfs" makes every podman
# invocation whose store is not on btrfs fail outright, and /tmp is tmpfs, so
# anything using --root there (podman's own test suite, tooling that isolates a
# store, "podman system migrate") dies with "prerequisites for driver not
# satisfied". With a priority list podman takes btrfs where it can and overlay
# where it cannot.
driver = ""
driver_priority = ["btrfs", "overlay"]
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.btrfs]
# Each image layer is a btrfs subvolume, containers are snapshots of it.
