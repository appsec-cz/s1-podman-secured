# Rootless storage, installed as /etc/skel/.config/containers/storage.conf so
# every user gets it when created.
#
# A user's own storage.conf replaces the system one entirely, which is the point:
# the system file sets runroot and graphroot for root, and those must never reach
# a rootless user. Without paths here podman uses /run/user/<uid>/containers and
# ~/.local/share/containers/storage. The driver settings repeat the system file's,
# because nothing from it is read once this file exists.
[storage]
driver = ""
driver_priority = ["btrfs", "overlay"]

[storage.options.btrfs]
