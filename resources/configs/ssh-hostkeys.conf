# Generate SSH host keys on the machine before sshd starts.
#
# The image ships without host keys: one baked in at build time would be shared
# by every machine deployed from it, and the build never needs one. Debian's
# sshd-keygen.service does the same job but only on a systemd "first boot", which
# does not happen when an image carries a machine-id - so this does not rely on
# it.
#
# The empty ExecStartPre resets the unit's own list; sshd's config test has to
# run *after* the keys exist or it fails with "no hostkeys available".
[Service]
ExecStartPre=
ExecStartPre=-/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
