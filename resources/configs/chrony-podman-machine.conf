# Step the clock whenever it is off by more than a second, not only during the
# first three updates as Debian's default "makestep 1 3" allows.
#
# Sleeping the Mac pauses the VM, and its clock stops with it. After the wake
# chrony may only slew, at most about 83 ms per second, so a night's sleep
# leaves the guest the better part of a day behind for days: journal times are
# wrong and certificates issued since then are "not yet valid".
makestep 1 -1
