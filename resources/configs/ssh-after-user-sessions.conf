# Start sshd only once logins are permitted.
#
# Until systemd-user-sessions.service has run, /run/nologin exists and PAM
# rejects every login with "Access denied ... by PAM account configuration".
# Nothing ordered the two, so on some boots sshd listened first - and the
# host connects the instant the port answers. Each rejection counts as a failed
# authentication for OpenSSH's PerSourcePenalties, and every client on the Mac
# arrives from the same gvproxy address, so a handful of early attempts locked
# all of them out for minutes: "podman machine ssh" exited 255 without a word.
#
# No cycle: post-ignition-setup is ordered before user sessions and reloads sshd
# with --no-block, and ignition-provider is ordered before both.
[Unit]
After=systemd-user-sessions.service
