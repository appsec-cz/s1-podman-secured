# CRITICAL: Listen on TCP port 22 (required for Podman Desktop)
# Debian 13's systemd-ssh-generator creates only vsock/unix by default
# We need traditional TCP socket for port forwarding to work
Port 22
ListenAddress 0.0.0.0

# Every client on the Mac reaches sshd through gvproxy, so they all arrive from
# 192.168.127.1, and the port is published only on the Mac's loopback. Limits
# that sshd keys on the source address therefore hit every client at once:
#   - PerSourcePenalties: one burst of failed logins (as at boot, before user
#     sessions are permitted) shut out Podman Desktop, the CLI and the API
#     together for minutes
#   - MaxStartups 10:30:100: past ten concurrent handshakes sshd drops new ones
#     at random, and "podman machine ssh" exits 255 without saying why
PerSourcePenaltyExemptList 192.168.127.1
MaxStartups 100:30:200

# Pubkey authentication
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys

# Keys only. Nobody here has a usable password - root is locked and podman gives
# the machine user none - so a password prompt could only ever fail, and it is
# one more way in to keep shut on a machine that exists for its security agent.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# PAM and environment
UsePAM yes
AcceptEnv LANG LC_*

# SFTP subsystem
Subsystem sftp /usr/lib/openssh/sftp-server
